name: Wetterstation

# Alle 10 Minuten: Wal-Positionen abholen, Momentaufnahme speichern, Website neu ausliefern.
# Anstöße:
# - cron-job.org alle 10 Min. per workflow_dispatch (seit 05.10.2026, OK Mirco) – Haupttakt.
# - GitHub-Zeitplan Minute 4, 14, 24 … als Sicherheitsnetz (06.10. entfernt, 16.10.2026 auf Mircos Wunsch
#   wieder eingesetzt). GitHub startet Zeitpläne nur „nach Möglichkeit“, oft Stunden zu spät.
# - Anstöße von Zeitplan und cron-job.org überspringen, wenn die letzte Messung jünger als 8 Min. ist
#   (Schritt „Doppelte Messung vermeiden“); Pushes messen immer.
# Aufbau in zwei Jobs (seit 16.10.2026): „messen“ und „ausliefern“. Anlass: Vom 12.10. 17:20 UTC bis
# 16.10. 09:35 UTC hing ein Lauf im Zustand „waiting“ an der Umgebung github-pages (ohne Prüfer, ohne
# Wartezeit – Störung bei GitHub). Weil die Umgebung am ganzen Job hing, wartete auch die Messung, und
# alle folgenden Anstöße wurden in der Warteschlange abgebrochen: rund 3,7 Tage ohne Messung.
# Jetzt hängt die Umgebung nur noch an „ausliefern“, und ein neuerer Auslieferungs-Job verdrängt einen
# hängenden. Die Messung läuft davon unabhängig weiter.
on:
  schedule:
    - cron: '4-59/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'collector/**'
      - 'config/**'
      - '.github/workflows/**'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  messen:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    # Messungen nie parallel (gleiche Gruppe wie bisher), aber unabhängig von der Website-Auslieferung
    concurrency:
      group: wetterstation
      cancel-in-progress: false
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - name: Doppelte Messung vermeiden
        id: guard
        if: github.event_name != 'push'
        run: |
          git pull -q origin main || true
          last=$(ls -1 data/history/*/*.json 2>/dev/null | sort | tail -1)
          if [ -z "$last" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          d=$(basename "$(dirname "$last")"); hm=$(basename "$last" .json)
          age=$(( $(date -u +%s) - $(date -u -d "$d ${hm:0:2}:${hm:2:2}" +%s) ))
          echo "Letzte Messung: $d $hm UTC, vor $((age/60)) Min."
          if [ "$age" -lt 480 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Übersprungen (jünger als 8 Min.)"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 22

      - name: Wale messen
        if: steps.guard.outputs.skip != 'true'
        run: node collector/collect.mjs

      - name: Momentaufnahme ins Repo
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history
          if git diff --cached --quiet; then echo "Nichts Neues"; exit 0; fi
          git commit -q -m "Messung $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done

      - uses: actions/configure-pages@v5
        if: steps.guard.outputs.skip != 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.guard.outputs.skip != 'true'
        with:
          path: _site

  ausliefern:
    needs: messen
    if: needs.messen.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Ein neuerer Auslieferungs-Job bricht einen älteren ab – auch einen, der an der Umgebung hängt
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      # Die Momentaufnahme ist zu diesem Zeitpunkt schon gesichert. Klemmt die Auslieferung der Website
      # kurz (z. B. 04.10.2026: Token-Fehler bei GitHub), einmal nach 30 s wiederholen, statt den Lauf scheitern zu lassen.
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Kurz warten vor zweitem Versuch
        if: steps.deploy.outcome == 'failure'
        run: sleep 30

      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
